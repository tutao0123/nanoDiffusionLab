[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nanodiffusionlab"
version = "0.1.0"
description = "A minimal PyTorch lab for autoregressive and diffusion language models."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["torch>=2.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
data = ["datasets>=3.0", "numpy>=1.26", "tiktoken>=0.8"]

[tool.setuptools]
py-modules = ["compare_runs", "config", "data", "diffusion", "experiment", "model", "sample", "train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
