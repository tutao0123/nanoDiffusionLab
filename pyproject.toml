[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nanodiffusionlab"
version = "0.1.0"
description = "A compact diffusion language-model trainer and GPT-style autoregressive trainer."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = ["numpy>=1.26", "torch>=2.3"]

[project.urls]
Repository = "https://github.com/tutao0123/nanoDiffusionLab"
Documentation = "https://github.com/tutao0123/nanoDiffusionLab#readme"
Issues = "https://github.com/tutao0123/nanoDiffusionLab/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
data = ["datasets>=3.0", "tiktoken>=0.8"]
eval = ["openai>=1.0"]
viz = ["matplotlib>=3.8", "pillow>=10"]

[tool.setuptools]
py-modules = ["config", "data", "diffusion", "evaluation", "experiment", "model", "sample", "train"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
